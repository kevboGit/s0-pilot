# Non-agent security checks for the S0-a pilot. No coding agent runs here and no secret is
# used. Started only by hand by someone with write access (workflow_dispatch); no
# pull_request, pull_request_target, push or comment triggers exist in this repository.
name: isolation-probes

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: isolation-probes
  cancel-in-progress: false

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (read-only token, not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Positive controls, as the runner user, before the sandbox exists
        run: bash scripts/controls.sh controls.env | tee controls.txt

      # From here on, every privileged command uses a PATH of root-owned directories only
      # (no /usr/local/bin, no agent-writable directory) and names its trusted binaries by
      # absolute path, so untrusted code that ran earlier cannot influence what runs here.
      - name: Build the sandbox (root)
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          sudo /usr/bin/bash scripts/setup-sandbox.sh | tee setup.txt
          sudo /usr/bin/install -o root -g root -m 644 controls.env /opt/s0/controls.env

      - name: Probes, as the unprivileged agent user with a clean environment
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          set -o pipefail
          sudo /usr/sbin/runuser -u agent -- /usr/bin/env -i \
            HOME=/home/agent TMPDIR=/home/agent/tmp PATH=/usr/bin:/bin \
            HTTPS_PROXY=http://127.0.0.1:3128 https_proxy=http://127.0.0.1:3128 \
            /usr/bin/bash /opt/s0/probes.sh /opt/s0/controls.env | tee probes.txt

      - name: Collect the proxy log
        if: always()
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          sudo /usr/bin/cat /var/log/squid/access.log >squid-access.txt 2>/dev/null || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-probes
          path: |
            controls.txt
            setup.txt
            probes.txt
            squid-access.txt
          retention-days: 30
